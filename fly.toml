app = "tabsplitter"
primary_region = "ord"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/tabsplitter.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "tabsplitter_data"
  destination = "/data"
